<text x="88.0" y="143.7" font-size="13" fill="#eb6834" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" text-anchor="start">63.5 ms</text>
<text x="88.0" y="302.7" font-size="13" fill="#2a78d6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" text-anchor="start">8.5 ms</text>
<text x="842.0" y="306.6" font-size="13" fill="#eb6834" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" text-anchor="start">9.2 ms</text>
<text x="842.0" y="338.4" font-size="13" fill="#2a78d6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" text-anchor="start">6.1 ms</text>
<text x="465.0" y="251.3" font-size="12.5" fill="#0b0b0b" font-weight="600">62% lower tail at a 50% hit rate</text>
<text x="465.0" y="267.3" font-size="11.5" fill="#52514e">the figure worth quoting — 100% is a ceiling no workload reaches</text>
<text x="32" y="414" font-size="10.5" fill="#52514e">Method: fixed set of 300 field-sized polygons, open-loop at 50 req/s, 300 requests per run, 5 runs per hit rate with the first</text>
<text x="32" y="428" font-size="10.5" fill="#52514e">discarded; points are the median of per-run medians. Synthetic load against a local Docker Compose stack — not production traffic;</text>
<text x="32" y="442" font-size="10.5" fill="#52514e">this service has no users. Apple M2 Pro, 10 cores. PostgreSQL 16 / PostGIS 3.4, Redis 7.</text>
</svg>