<line x1="74" y1="325.9" x2="828" y2="325.9" stroke="#52514e" stroke-width="1" opacity="0.5"/>
<text x="86" y="335.3" font-size="11" fill="#52514e">transport floor · 5.03 ms · HTTP, validation and Docker networking — no cache removes this</text>
<text x="74.0" y="368" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0%</text>
