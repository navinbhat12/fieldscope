<text x="32" y="44" font-size="19" font-weight="600" fill="#0b0b0b">What the cache is worth, by hit rate</text>
<text x="32" y="68" font-size="13" fill="#52514e">The tail collapses as requests start repeating; the median barely moves — 50 req/s synthetic load</text>
