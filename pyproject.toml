[project]
name = "fieldscope"
version = "0.1.0"
description = "Distributed overlay engine joining large public geographic datasets, served from the edge"
requires-python = ">=3.11,<3.12"

dependencies = [
    # Distributed processing. Pinned to the Spark 3.5 / Sedona 1.7 pairing —
    # Sedona's jars are built per Spark minor version, so these move together.
    "pyspark==3.5.3",
    "apache-sedona[spark]==1.7.1",

    # Vector I/O and geometry for the exploration phase and for validating
    # Spark output against a single-machine ground truth.
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "fiona>=1.10",

    # Raster: CDL ships as a GeoTIFF and has to be read/clipped before it can
    # be joined against the vector layers.
    "rasterio>=1.3",

    # Data pull + tabular work
    "requests>=2.32",
    "pandas>=2.2",
    "pyarrow>=17.0",
]

[dependency-groups]
dev = [
    "jupyter>=1.1",
    "matplotlib>=3.9",
    "folium>=0.17",
    "ruff>=0.7",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fieldscope"]

[tool.ruff]
line-length = 100
target-version = "py311"
